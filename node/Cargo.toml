[package]
name = "blazeevm-node"
version = "0.1.0"
edition = "2021"
description = "BlazeEVM node: CLI and RPC server for local EVM development"
authors = ["BlazeEVM Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevintatou/BlazeEVM"

[[bin]]
name = "blazeevm-node"
path = "src/main.rs"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.42.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
tower = "0.5.2"

[dev-dependencies]
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
